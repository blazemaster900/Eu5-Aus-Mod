l_english:
  SGF_f: "South German Confederation"
  SGF_f_desc: "For untold Millennia, the princes of South Germany have have been divided and locked in neverending power struggles. If we want to stand tall amongst the great powers of the world and reunite the german world, we must strive to create a lasting union between our peoples, as difficult as this might seem. Also we must exterminate those who occupy germany with their inferiority"

